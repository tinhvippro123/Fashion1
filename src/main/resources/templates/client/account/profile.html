<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout}">
<head>
    <title>Thông tin tài khoản | Luxe Fashion</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-luxe" style="margin-bottom: 50px;">
            
            <div class="text-muted" style="font-size: 14px; border-bottom: 1px solid #e1e1e1; padding-top: 20px; padding-bottom: 21px; margin-bottom: 40px;">
                <a th:href="@{/}" class="text-muted" style="text-decoration: none;">Trang chủ</a> 
                <span class="mx-2">-</span> 
                <span class="text-dark">Tài khoản của tôi</span>
            </div>

            <div class="d-flex flex-column flex-lg-row">
                
                <div class="mb-4 account-sidebar-margin" style="flex-shrink: 0;">
                   <div th:replace="~{client/account/sidebar :: account-sidebar(activePage='profile')}"></div>
                </div>

                <div style="flex-grow: 1; min-width: 0;">
                    
                    <h5 class="font-weight-bold mb-3 text-uppercase" style="font-size: 18px;">Tài khoản của tôi</h5>

                    <div class="alert alert-primary border-0 rounded-0 mb-4" style="background-color: #d1ecf1; color: #0c5460; font-size: 14px;">
                        "Vì chính sách an toàn thẻ, bạn không thể thay đổi SĐT, Ngày sinh, Họ tên. Vui lòng liên hệ CSKH 0905898683 để được hỗ trợ"
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                        <i class="fas fa-check-circle mr-2"></i> <span th:text="${successMessage}"></span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    </div>

                    <form th:action="@{/account/update}" method="post">
                        <div class="row">
                            <div class="col-lg-7 order-2 order-lg-1">
                                <style>
                                    .profile-form-row {
                                        flex-direction: column;
                                        align-items: flex-start !important;
                                    }
                                    .profile-label {
                                        width: 100%;
                                        margin-bottom: 8px;
                                    }
                                    .profile-btn-spacer {
                                        display: none;
                                    }
                                    .hide-on-mobile {
                                        display: none !important;
                                    }
                                    .date-mobile-bg {
                                        border-top: 1px solid #e7e8e9 !important;
                                        border-bottom: 1px solid #e7e8e9 !important;
                                        border-radius: 0 !important;
                                        padding-top: 15px !important;
                                        padding-bottom: 15px !important;
                                    }
                                    .custom-radio .custom-control-input:checked ~ .custom-control-label::before {
                                        background-color: #222;
                                        border-color: #222;
                                    }
                                    .custom-radio .custom-control-input:checked ~ .custom-control-label::after {
                                        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%23fff' d='M6.564.75l-3.59 3.612-1.538-1.55L0 4.26 2.974 7.25 8 2.193z'/%3e%3c/svg%3e");
                                        border-radius: 0;
                                    }
                                    @media (min-width: 768px) {
                                        .profile-form-row {
                                            flex-direction: row;
                                            align-items: center !important;
                                        }
                                        .profile-label {
                                            width: 150px;
                                            margin-bottom: 0;
                                        }
                                        .profile-btn-spacer {
                                            display: block;
                                            width: 150px;
                                            flex-shrink: 0;
                                        }
                                        .hide-on-mobile {
                                            display: block !important;
                                        }
                                        .date-mobile-bg {
                                            border: 0 !important;
                                            border-radius: 4px !important;
                                            padding-top: 10px !important;
                                            padding-bottom: 10px !important;
                                        }
                                    }
                                </style>
                                
                                <div class="d-flex profile-form-row mb-4">
                                    <label class="text-muted mb-0 profile-label" style="font-size: 14px; flex-shrink: 0;">Họ</label>
                                    <div style="flex-grow: 1; width: 100%;">
                                        <input type="text" class="form-control-luxe mb-0 bg-light border-0 w-100" th:value="${displayLastName}" readonly style="border-radius: 4px; padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="d-flex profile-form-row mb-4">
                                    <label class="text-muted mb-0 profile-label" style="font-size: 14px; flex-shrink: 0;">Tên</label>
                                    <div style="flex-grow: 1; width: 100%;">
                                        <input type="text" class="form-control-luxe mb-0 bg-light border-0 w-100" th:value="${displayFirstName}" readonly style="border-radius: 4px; padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="d-flex profile-form-row mb-4">
                                    <label class="text-muted mb-0 profile-label" style="font-size: 14px; flex-shrink: 0;">Số điện thoại</label>
                                    <div style="flex-grow: 1; width: 100%;">
                                        <input type="text" class="form-control-luxe mb-0 bg-light border-0 w-100" th:value="${user.phone}" readonly style="border-radius: 4px; padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="d-flex profile-form-row mb-4">
                                    <label class="text-muted mb-0 profile-label" style="font-size: 14px; flex-shrink: 0;">Email</label>
                                    <div style="flex-grow: 1; width: 100%;">
                                        <input type="email" name="email" class="form-control-luxe mb-0 w-100" th:value="${user.email}" style="border-radius: 4px; border: 1px solid #f0f0f0; padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="d-flex profile-form-row mb-4">
                                    <label class="text-muted mb-0 profile-label hide-on-mobile" style="font-size: 14px; flex-shrink: 0;">Giới tính</label>
                                    <div style="flex-grow: 1; width: 100%;">
                                        <div class="d-flex align-items-center">
                                            <div class="custom-control custom-radio mr-4">
                                                <input type="radio" id="g-nam" name="gender" value="MALE" class="custom-control-input" 
                                                       th:checked="${user.gender?.name() == 'MALE'}">
                                                <label class="custom-control-label" for="g-nam">Nam</label>
                                            </div>
                                            <div class="custom-control custom-radio mr-4">
                                                <input type="radio" id="g-nu" name="gender" value="FEMALE" class="custom-control-input"
                                                       th:checked="${user.gender?.name() == 'FEMALE'}">
                                                <label class="custom-control-label" for="g-nu">Nữ</label>
                                            </div>
                                            <div class="custom-control custom-radio">
                                                <input type="radio" id="g-khac" name="gender" value="OTHER" class="custom-control-input"
                                                       th:checked="${user.gender?.name() == 'OTHER'}">
                                                <label class="custom-control-label" for="g-khac">Khác</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex profile-form-row mb-4">
                                    <label class="text-muted mb-0 profile-label hide-on-mobile" style="font-size: 14px; flex-shrink: 0;">Ngày sinh</label>
                                    <div style="flex-grow: 1; width: 100%;">
                                        <input type="date" class="form-control-luxe mb-0 bg-light w-100 date-mobile-bg" th:value="${user.dateOfBirth}" readonly style="border-radius: 4px; padding: 10px 15px;">
                                    </div>
                                </div>

                                <div class="d-flex mt-3">
                                    <div class="profile-btn-spacer"></div>
                                    <div class="d-flex w-100">
                                        <button type="submit" class="btn btn-dark px-4 py-2 mr-3 font-weight-bold" style="border-radius: 20px 0 20px 0;">CẬP NHẬT</button>
                                        
                                        <button type="button" class="btn btn-outline-dark px-4 py-2 font-weight-bold" 
                                                style="border-radius: 20px 0 20px 0; color: #333;" 
                                                data-toggle="modal" data-target="#changePasswordModal">
                                            ĐỔI MẬT KHẨU
                                        </button>
                                    </div>
                                </div>

                            </div>

                            <div class="col-lg-5 order-1 order-lg-2 mb-4 mb-lg-0 mt-lg-0 pl-lg-4">
                                <table class="table table-bordered mb-3 text-center" style="font-size: 14px;">
                                    <tbody>
                                        <tr>
                                            <td class="bg-light text-muted py-3 px-4 align-middle" style="width: 50%;">Điểm chiết khấu</td>
                                            <td class="font-weight-bold py-3 px-4 align-middle">0</td>
                                        </tr>
                                        <tr>
                                            <td class="bg-light text-muted py-3 px-4 align-middle">Chiết khấu</td>
                                            <td class="font-weight-bold py-3 px-4 align-middle">0%</td>
                                        </tr>
                                        <tr>
                                            <td class="bg-light text-muted py-3 px-4 align-middle">Hạn thẻ</td>
                                            <td class="font-weight-bold py-3 px-4 align-middle">14/04/2027</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        
        <div class="modal fade" id="changePasswordModal" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content" style="border-radius: 0;">
                    
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title font-weight-bold text-uppercase w-100 text-center" style="letter-spacing: 1px;">
                            ĐỔI MẬT KHẨU
                        </h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div class="modal-body pt-4 px-5 pb-5">
                        <form th:action="@{/account/change-password}" method="post">
                            
                            <div class="form-group">
                                <label class="small text-muted font-weight-bold">Mật khẩu hiện tại</label>
                                <input type="password" name="currentPassword" class="form-control-luxe" required>
                            </div>

                            <div class="form-group">
                                <label class="small text-muted font-weight-bold">Mật khẩu mới</label>
                                <input type="password" name="newPassword" class="form-control-luxe" required>
                            </div>

                            <div class="form-group">
                                <label class="small text-muted font-weight-bold">Nhập lại Mật khẩu mới</label>
                                <input type="password" name="confirmPassword" class="form-control-luxe" required>
                            </div>

                            <button type="submit" class="btn btn-dark btn-block font-weight-bold py-3 mt-4" style="border-radius: 4px 0 4px 0;">
                                CẬP NHẬT
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
