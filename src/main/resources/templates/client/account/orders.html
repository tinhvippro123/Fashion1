<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{client/layout}">
<head>
<title>Quản lý đơn hàng | Luxe Fashion</title>
</head>
<body>
	<div layout:fragment="content">
		<style>
			@media (max-width: 1199px) {
				.orders-table thead { display: none; }
				.orders-table tbody tr {
					display: flex;
					flex-wrap: wrap;
					border-bottom: 1px solid #e1e1e1;
					padding: 16px 0;
				}
				.orders-table tbody tr td {
					border: none !important;
					padding: 2px 0 !important;
					text-align: left !important;
				}
				/* Row 1: ID (left) + Date (right) = full width */
				.orders-table .td-id {
					flex: 0 0 auto;
				}
				.orders-table .td-date {
					flex: 1 1 auto;
					text-align: right !important;
				}
				/* Row 2: Products = full width */
				.orders-table .td-products {
					flex: 0 0 100%;
					padding-top: 8px !important;
				}
				/* Row 3: Price (left) + Status (right) = full width */
				.orders-table .td-price {
					flex: 0 0 auto;
					padding-top: 8px !important;
				}
				.orders-table .td-status {
					flex: 1 1 auto;
					text-align: right !important;
					padding-top: 8px !important;
				}
				.order-header-row {
					/* Keep flex-row, just ensure items can wrap if screen is very tiny */
					flex-wrap: wrap;
				}
				.order-header-row .order-filter {
					/* Ensure filter stays on the right */
					margin-left: auto;
				}
			}
		</style>
		<div class="container-luxe" style="margin-bottom: 50px;">
			<div class="text-muted" style="font-size: 14px; border-bottom: 1px solid #e1e1e1; padding-top: 20px; padding-bottom: 21px; margin-bottom: 40px;">
				<a th:href="@{/}" class="text-muted" style="text-decoration: none;">Trang chủ</a> 
				<span class="mx-2">-</span>
				<span class="text-dark">Quản lý đơn hàng</span>
			</div>

            <div class="d-flex flex-column flex-lg-row">
                
                <div class="mb-4 account-sidebar-margin" style="flex-shrink: 0;">
                   <div th:replace="~{client/account/sidebar :: account-sidebar(activePage='orders')}"></div>
                </div>

                <div style="flex-grow: 1; min-width: 0;">

					<div class="d-flex justify-content-between align-items-center mb-4 order-header-row">
						<h5 class="font-weight-bold mb-0 text-uppercase" style="font-size: 18px;">QUẢN LÝ ĐƠN HÀNG</h5>

						<div class="d-flex align-items-center order-filter">
							<label class="text-muted mr-2 mb-0">Trạng thái đơn hàng:</label> <select
								class="form-control-luxe form-control-sm mb-0" style="width: 150px;">
								<option>Tất cả</option>
								<option>Chờ xác nhận</option>
								<option>Đang giao</option>
								<option>Đã hủy</option>
							</select>
						</div>
					</div>

					<div class="table-responsive">
						<table class="table table-hover border-bottom orders-table">
							<thead class="bg-white border-top border-bottom">
								<tr class="text-muted small text-uppercase font-weight-bold">
									<th class="border-0 py-3">Mã đơn hàng</th>
									<th class="border-0 py-3">Ngày</th>
									<th class="border-0 py-3" style="width: 35%;">Sản phẩm</th>
									<th class="border-0 py-3 text-right">Tổng tiền</th>
									<th class="border-0 py-3">Trạng thái</th>
								</tr>
							</thead>
							<tbody class="bg-white">
								<tr th:if="${#lists.isEmpty(orders)}">
									<td colspan="5" class="text-center py-5 text-muted">Bạn
										chưa có đơn hàng nào.</td>
								</tr>

								<tr th:each="order : ${orders}">

									<td class="align-middle td-id"><a
										th:href="@{'/account/orders/' + ${order.id}}"
										class="text-dark font-weight-bold"
										style="text-decoration: underline;"
										th:text="'IVM' + ${order.id}">IVM123</a></td>

									<td class="align-middle small text-muted td-date"
										th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm:ss')}">
										08/12/2025</td>

									<td class="align-middle td-products">
										<div th:each="item : ${order.orderItems}" class="small mb-1">
											<span th:text="${item.quantity} + 'x'"></span> <span
												th:text="${item.productName}">Tên SP</span><span
												th:text="', ' + ${item.colorName}">
											</span>
										</div>
									</td>

									<td class="align-middle font-weight-bold td-price"><span
										th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'">
											2,090,000 đ </span></td>

									<td class="align-middle small td-status"><span
										th:switch="${order.status.name()}"> <span
											th:case="'PENDING'"><i
												class="fas fa-clock mr-1 text-warning"></i> Chờ xử lý</span> <span
											th:case="'SHIPPING'"><i
												class="fas fa-truck mr-1 text-info"></i> Đang giao</span> <span
											th:case="'DELIVERED'"><i
												class="fas fa-check-circle mr-1 text-success"></i> Đã giao</span> <span
											th:case="'CANCELLED'"><i
												class="fas fa-sync mr-1 text-secondary" style="font-size:12px;"></i> Đã hủy đơn hàng</span>
											<span th:case="*" th:text="${order.status}"></span>
									</span></td>
								</tr>
							</tbody>
						</table>
					</div>

					<div class="d-flex justify-content-center mt-5" th:if="${page.totalPages > 1}">
						<nav>
							<ul class="pagination pagination-sm">
								<li class="page-item mx-1" 
									th:each="pageNum : ${#numbers.sequence(0, page.totalPages - 1)}">
									<a class="page-link text-center" 
									   style="width: 30px; height: 30px; line-height: 18px; border-radius: 4px;"
									   th:classappend="${pageNum == page.number} ? 'bg-dark border-dark text-white' : 'text-dark bg-white border-0'" 
									   th:href="@{/account/orders(page=${pageNum})}" 
									   th:text="${pageNum + 1}">1</a>
								</li>
							</ul>
						</nav>
					</div>

				</div>
			</div>
		</div>
	</div>
</body>
</html>
