<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{client/layout}">
<head>
<title>Sản phẩm đã xem | Luxe Fashion</title>
</head>
<body>
	<div layout:fragment="content">
        <div class="container-luxe" style="margin-bottom: 50px;">
            
            <div class="text-muted" style="font-size: 14px; border-bottom: 1px solid #e1e1e1; padding-top: 20px; padding-bottom: 21px; margin-bottom: 40px;">
                <a th:href="@{/}" class="text-muted" style="text-decoration: none;">Trang chủ</a> 
                <span class="mx-2">-</span> 
                <span class="text-dark">Sản phẩm đã xem</span>
            </div>

            <div class="d-flex flex-column flex-lg-row">
                
                <div class="mb-4 account-sidebar-margin" style="flex-shrink: 0;">
                   <div th:replace="~{client/account/sidebar :: account-sidebar(activePage='viewed_products')}"></div>
                </div>

                <div style="flex-grow: 1; min-width: 0;">
                    <h5 class="font-weight-bold mb-4 text-uppercase" style="font-size: 20px;">Sản phẩm đã xem</h5>

					<div th:if="${#lists.isEmpty(recentProducts)}" class="text-center py-5">
						<i class="fas fa-history text-muted mb-3" style="font-size: 50px;"></i>
						<h5 class="text-muted">Bạn chưa xem sản phẩm nào</h5>
						<a th:href="@{/}" class="btn btn-dark mt-3 px-4 py-2" style="border-radius: 0;">Tiếp tục mua sắm</a>
					</div>

					<div th:unless="${#lists.isEmpty(recentProducts)}" class="row">
						<div class="col-lg-3 col-6 mb-4" th:each="product : ${recentProducts}">
							<div th:replace="~{client/fragments/product-card :: product-item(p=${product})}"></div>
						</div>
					</div>
                </div>
            </div>
        </div>
	</div>

</body>
</html>
