<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

	<div th:fragment="account-sidebar(activePage)">
		<style>
			.order-sidemenu-custom {
				width: 100%;
				padding: 15px 20px !important;
			}
			.sidebar-menu-custom {
				margin-top: 25px;
				padding-top: 25px;
				border-top: 1px solid #e7e8e9;
			}
			@media (min-width: 992px) {
				.order-sidemenu-custom {
					width: 235px !important;
					padding: 32px 33px !important;
				}
			}
		</style>
	    <div class="order-sidemenu block-border order-sidemenu-custom" style="margin-bottom: 30px; border: 1px solid #e7e8e9; border-radius: 32px 0 32px 0; background-color: #fff; color: #6c6d70; text-align: left;">
	        <!-- User Profile Summary -->
			<div class="d-flex align-items-center justify-content-between"
				 id="accountSidebarHeader" style="cursor: pointer;">
				<div class="d-flex align-items-center">
					<div style="width: 42px; height: 42px; background-color: #e8e8e8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px;">
						<i class="fas fa-user" style="color: #b0b0b0; font-size: 20px;"></i>
					</div>
					<div>
						<div style="font-weight: 600; font-size: 16px; color: #555;" th:if="${user != null}" th:text="${user.fullName}">Tên User</div>
						<div style="font-weight: 600; font-size: 16px; color: #555;" th:if="${user == null}">Khách hàng</div>
					</div>
				</div>
				<i class="fas fa-angle-down d-lg-none" style="color: #666; font-size: 18px; transition: transform 0.3s;" id="accountSidebarChevron"></i>
			</div>
	
	        <!-- Navigation Menu -->
			<div class="collapse" id="accountSidebarMenu">
				<ul class="list-unstyled mb-0 sidebar-menu-custom" style="font-size: 14px;">
				<script>
					// Initialize sidebar state based on screen size
					(function() {
						var menu = document.getElementById('accountSidebarMenu');
						var icon = document.getElementById('accountSidebarChevron');
						var header = document.getElementById('accountSidebarHeader');
						
						if (window.innerWidth >= 992) {
							menu.classList.add('show');
							icon.style.transform = 'rotate(0deg)'; // point down when open
						} else {
							menu.classList.remove('show');
							icon.style.transform = 'rotate(-90deg)'; // point right when collapsed
						}

						// Handle icon rotation and toggle on click
						header.addEventListener('click', function() {
							if (window.innerWidth >= 992) return;
							
							var isExpanded = menu.classList.contains('show');
							
							// Bootstrap collapse is handled by data-toggle if we added it, 
							// but since we don't have data-toggle on header, we must manually toggle
							if (isExpanded) {
								$(menu).collapse('hide');
								icon.style.transform = 'rotate(-90deg)';
							} else {
								$(menu).collapse('show');
								icon.style.transform = 'rotate(0deg)';
							}
						});
						
						// Handle resize events
						window.addEventListener('resize', function() {
							if (window.innerWidth >= 992) {
								$(menu).collapse('show');
							} else {
								$(menu).collapse('hide');
							}
						});
					})();
				</script>
				<li style="margin-bottom: 32px;">
				    <a th:href="@{/account/profile}" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'profile'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="far fa-user" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'profile'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Thông tin tài khoản
				    </a>
				</li>
	
				<li style="margin-bottom: 32px;">
				    <a href="javascript:void(0)" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'login_history'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="fas fa-lock" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'login_history'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Lịch sử đăng nhập
				    </a>
				</li>
	
				<li style="margin-bottom: 32px;">
				    <a th:href="@{/account/orders}" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'orders'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="fas fa-sync" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'orders'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Quản lý đơn hàng
				    </a>
				</li>
	
				<li style="margin-bottom: 32px;">
				    <a th:href="@{/account/addresses}" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'addresses'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="fas fa-map-marker-alt" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'addresses'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Sổ địa chỉ
				    </a>
				</li>
	
				<li style="margin-bottom: 32px;">
				    <a th:href="@{/account/recently-viewed}" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'viewed_products'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="fas fa-glasses" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'viewed_products'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Sản phẩm đã xem
				    </a>
				</li>
				
				<li style="margin-bottom: 32px;">
				    <a th:href="@{/account/wishlist}" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'favorite_products'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="far fa-heart" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'favorite_products'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Sản phẩm yêu thích
				    </a>
				</li>
				
				<li style="margin-bottom: 32px;">
				    <a href="javascript:void(0)" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'faq'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="fas fa-headset" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'faq'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Hỏi đáp sản phẩm
				    </a>
				</li>
				
				<li style="margin-bottom: 0;">
				    <a href="javascript:void(0)" style="text-decoration: none; display: flex; align-items: center; transition: 0.3s; white-space: nowrap;"
					   th:styleappend="${activePage == 'support'} ? 'color: #111; font-weight: 600;' : 'color: #666; font-weight: 500;'"> 
					   <i class="far fa-hand-point-right" style="width: 13px; height: 14px; display: inline-flex; justify-content: center; align-items: center; margin-right: 15px; font-size: 14px;" th:styleappend="${activePage == 'support'} ? 'color: #111;' : 'color: #a0a0a0;'"></i> Hỗ trợ - LUXE
				    </a>
				</li>
			</ul>
			</div>
		</div>
	</div>
</body>
</html>
