<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

	<div th:fragment="mini-cart-content"
		style="width: 100%; height: 100%; display: flex; flex-direction: column;">

		<div class="mini-cart-header" style="border-bottom: none; padding: 25px 20px;">
			<h5 class="m-0" style="font-size: 18px; font-weight: bold; color: #111;">
				Giỏ hàng 
				<span class="badge badge-dark rounded-circle ml-2" style="font-size: 14px; padding: 4px 7px; font-weight: normal; background-color: #222;" th:text="${globalCartCount}">0</span>
			</h5>
			<button onclick="closeMiniCart()" class="close-btn" style="font-size: 28px; font-weight: 300; outline: none; border: none; background: transparent; color: #333;">&times;</button>
		</div>

		<div class="mini-cart-body" style="flex-grow: 1; overflow-y: auto;">
			<!-- Empty state: No text as requested by the screenshot -->
			<div th:if="${globalCart == null || #lists.isEmpty(globalCart.items)}" style="padding: 20px;">
			</div>

			<th:block th:if="${globalCart != null}">
				<div th:each="item : ${globalCart.items}" class="mini-cart-item">
					<div class="d-flex">
						<img th:if="${not #lists.isEmpty(item.variant.productColor.images)}"
							th:src="@{'/uploads/' + ${item.variant.productColor.images[0].imageUrl}}"
							class="mini-cart-img">

						<div class="ml-3 w-100">
							<p class="mb-1 font-weight-bold" th:text="${item.variant.productColor.product.name}">Tên SP</p>
							<small class="text-muted"> Màu: <span th:text="${item.variant.productColor.color.name}"></span> |
								Size: <span th:text="${item.variant.size.name}"></span>
							</small>

							<div class="d-flex justify-content-between align-items-center mt-2">
								<div class="input-group" style="width: 90px; border: 1px solid #e5e5e5; border-radius: 4px; overflow: hidden;">
									<button type="button" class="btn btn-light" style="padding: 2px 10px; border: none; background: #fff; font-size: 16px; outline: none; box-shadow: none;" th:attr="onclick=|updateMiniCartQty('${item.id}', '${item.quantity - 1}')|">-</button>
									<input type="text" class="form-control text-center" style="padding: 2px; height: 30px; border: none; font-size: 14px; background: #fff;" th:value="${item.quantity}" readonly>
									<button type="button" class="btn btn-light" style="padding: 2px 10px; border: none; background: #fff; font-size: 16px; outline: none; box-shadow: none;" th:attr="onclick=|updateMiniCartQty('${item.id}', '${item.quantity + 1}')|">+</button>
								</div>
								<span class="font-weight-bold text-danger"
									th:with="unitPrice=${item.variant.productColor.product.basePrice}"
									th:text="${#numbers.formatDecimal(unitPrice * item.quantity, 0, 'POINT', 0, 'COMMA')} + 'đ'">
								</span>
							</div>
						</div>
					</div>
				</div>
			</th:block>
		</div>

		<div class="mini-cart-footer" style="border-top: none; padding: 20px 20px 80px 20px; background: #fff;">

			<div class="text-right mb-0">
				<span style="color: #777; font-weight: 500;">Tổng cộng:</span> 
				<span class="font-weight-bold ml-1 text-dark" style="font-size: 16px;" th:text="${#numbers.formatDecimal(globalTotalPrice != null ? globalTotalPrice : 0, 0, 'POINT', 0, 'COMMA')} + 'đ'">0đ</span>
			</div>

			<div class="d-flex flex-column mt-3" th:if="${globalCart != null && not #lists.isEmpty(globalCart.items)}">
				<a th:href="@{/cart}" class="btn btn-dark btn-block mb-2 py-3 font-weight-bold" style="border-radius: 4px 0 4px 0;"> XEM GIỎ HÀNG </a>
				<a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="btn btn-outline-dark btn-block py-3 font-weight-bold" style="border-radius: 4px 0 4px 0;"> ĐĂNG NHẬP </a>
			</div>
		</div>
	</div>

</body>
</html>
