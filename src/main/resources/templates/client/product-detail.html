<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layout}">
<head>
    <title th:text="${product.name} + ' - Luxe Fashion'">Chi tiết sản phẩm</title>
    <style>
        /* CSS cho ô màu sắc */
        .color-option-box {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            border-radius: 50%; /* Tròn */
            cursor: pointer;
            display: inline-block;
            margin-right: 10px;
            position: relative;
        }
        /* Hiệu ứng khi màu đang được chọn (không dùng vòng viền nữa) */
        .color-option-box.active-color {
            /* Giữ lại viền gốc nếu có, hoặc để trống */
        }
        /* Gạch chéo cho size hết hàng */
        .size-box.disabled {
            background-color: #f8f9fa;
            color: #ccc;
            cursor: not-allowed;
            text-decoration: line-through;
            border-color: #eee;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">

        <div class="container-ivy">
            <div class="text-muted" style="font-size: 14px; border-bottom: 1px solid #e1e1e1; padding-top: 20px; padding-bottom: 21px; margin-bottom: 40px;"> 
                <a th:href="@{/}" class="text-muted" style="text-decoration: none;">Trang chủ</a> 
                <span class="mx-2">-</span> 
                <th:block th:if="${product.category != null}">
                    <a th:if="${product.category.parent != null}" th:href="@{'/danh-muc/' + ${product.category.parent.slug}}" class="text-muted" style="text-decoration: none;" th:text="${#strings.toUpperCase(product.category.parent.name)}"></a>
                    <a th:if="${product.category.parent == null}" th:href="@{'/danh-muc/' + ${product.category.slug}}" class="text-muted" style="text-decoration: none;" th:text="${#strings.toUpperCase(product.category.name)}"></a>
                    <span class="mx-2">-</span> 
                </th:block>
                <span class="text-dark" th:text="${product.name}"></span>
            </div>
        </div>

        <div class="container-ivy">
            <div class="product-detail-row">

                <div>
                    <div th:if="${selectedColor != null}" class="gallery-wrapper">

                        <div class="gallery-main">
                            <!-- Nút Back -->
                            <button type="button" class="main-arrow prev" onclick="prevMainImage()" th:if="${not #lists.isEmpty(selectedColor.images) and selectedColor.images.size() > 1}">
                                <svg width="24" height="40" viewBox="0 0 24 40" fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 5 5 20 20 35"></polyline></svg>
                            </button>

                            <img id="mainImage"
                                 th:if="${not #lists.isEmpty(selectedColor.images)}"
                                 th:src="@{'' + ${selectedColor.images[0].imageUrl}}"
                                 class="main-img-display" alt="Ảnh chính">
                                 
                            <img id="mainImage"
                                 th:if="${#lists.isEmpty(selectedColor.images)}"
                                 src="https://via.placeholder.com/500x750?text=No+Image"
                                 class="main-img-display">

                            <!-- Nút Next -->
                            <button type="button" class="main-arrow next" onclick="nextMainImage()" th:if="${not #lists.isEmpty(selectedColor.images) and selectedColor.images.size() > 1}">
                                <svg width="24" height="40" viewBox="0 0 24 40" fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 5 19 20 4 35"></polyline></svg>
                            </button>
                        </div>

                        <div class="gallery-thumbs-container" th:if="${not #lists.isEmpty(selectedColor.images)}">
    <button class="thumb-arrow up"
            th:if="${selectedColor.images.size() > 4}" 
            onclick="scrollThumbs('up')">
        <i class="fas fa-chevron-up"></i>
    </button>

    <div class="gallery-thumbs-scroll" id="thumbScroller">
        <img th:each="img, iter : ${selectedColor.images}"
             th:src="@{'' + ${img.imageUrl}}" class="thumb-img"
             th:classappend="${iter.index == 0} ? 'active'"
             th:onclick="'changeMainImage(this, \'' + @{'' + ${img.imageUrl}} + '\')'">
    </div>

    <button class="thumb-arrow down"
            th:if="${selectedColor.images.size() > 4}"
            onclick="scrollThumbs('down')">
        <i class="fas fa-chevron-down"></i>
    </button>
</div>
                    </div>
                </div>

                <div class="product-info-col">
                    
                    <input type="hidden" name="productId" th:value="${product.id}">

                    <h2 class="font-weight-bold text-uppercase mb-3"
                        style="font-size: 28px;" th:text="${product.name}"></h2>

                    <div class="d-flex align-items-center mb-4 text-muted" style="font-size: 14px;">
                        <div class="mr-4">
                            <span>SKU: <span th:text="${product.id}"></span>M9377</span>
                        </div>
                        <div class="d-flex align-items-center">
                            <div class="text-warning mr-2">
                                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                            </div>
                            <span>(0 đánh giá)</span>
                        </div>
                    </div>

                    <div class="d-flex align-items-center mb-4">
                        <div class="font-weight-bold" th:text="${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'COMMA')} + 'đ'" style="font-size: 24px; color: #222;"></div>
                    </div>

                    <div class="mb-4 mt-3">
                        <div class="color-label mb-2" style="font-size: 18px;">
                            <span class="font-weight-bold" style="color: #222;">Màu sắc:</span> <span th:text="${selectedColor.color.name}">Trắng ngà</span>
                        </div>
                        <div class="d-flex flex-wrap">
                            <th:block th:each="pc : ${product.productColors}">
                                <a th:if="${pc.isActive}" 
                                   th:href="@{'/product/' + ${product.id} + '?color=' + ${pc.color.name}}"
                                   th:title="${pc.color.name}"
                                   style="text-decoration: none;">
                                    
                                    <span class="color-option-box"
                                          th:classappend="${pc.id == selectedColor.id} ? 'active-color'"
                                          th:style="'background-color:' + ${pc.color.hexCode} + '; ' + (${pc.color.hexCode} == '#FFFFFF' ? 'border: 1px solid #ccc;' : '')">
                                        <i class="fas fa-check check-icon" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 12px; mix-blend-mode: difference;"></i>
                                    </span>
                                </a>
                            </th:block>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="mb-3">
                            <div th:each="variant : ${selectedColor.variants}"
                                 class="size-box"
                                 th:classappend="${variant.stock <= 0} ? 'disabled'"
                                 th:onclick="${variant.stock > 0} ? 'selectSize(this)' : ''"
                                 th:title="${variant.stock <= 0} ? 'Hết hàng' : 'Còn ' + ${variant.stock}">
                                
                                <span th:text="${variant.size.name}">S</span>
                                
                                <input type="radio" name="variantId" th:value="${variant.id}" hidden>
                            </div>

                            <div id="size-error" class="text-danger mt-2"
                                 style="display: none; font-size: 13px;">
                                <i class="fas fa-exclamation-circle"></i> Vui lòng chọn kích cỡ (Size)
                            </div>
                            
                            <div th:if="${#lists.isEmpty(selectedColor.variants)}" class="text-danger mt-2 small">
                                Tạm hết hàng màu này.
                            </div>
                        </div>
                        
                        <div class="text-muted small" style="cursor: pointer;">
                            <i class="fas fa-ruler mr-1"></i> Kiểm tra size của bạn
                        </div>
                    </div>

					<div class="mb-4 d-flex align-items-center">
					    <label class="font-weight-normal mr-4 mb-0" style="font-size: 15px;">Số lượng</label>
					    <div class="qty-control">
					        <button type="button" class="qty-btn" onclick="updateQty(-1)">-</button>
					        <input type="text" name="quantity" id="qtyInput" value="1" class="qty-input" readonly>
					        <button type="button" class="qty-btn" onclick="updateQty(1)">+</button>
					    </div>
					</div>
					
					<div class="action-buttons mb-4">
					    <button type="button" onclick="addToCartFromDetail()" class="btn-add-cart-black">
					        THÊM VÀO GIỎ
					    </button>
					
					    <button type="button" class="btn-buy-now-white" onclick="buyNow()">
					        MUA HÀNG
					    </button>
					
					    <button type="button" class="btn-wishlist-box" th:data-product-id="${product.id}" onclick="toggleWishlistDetail(this)">
					        <i class="far fa-heart"></i>
					    </button>
					</div>
					
					<div class="mb-5">
					    <a href="#" class="text-dark" style="text-decoration: underline; font-size: 14px;">Tìm tại cửa hàng</a>
					</div>
                                        
				    <div class="mt-4">
				        <ul class="nav nav-tabs mb-4" id="detailTab" role="tablist" style="border-bottom: 1px solid #f0f0f0; display: flex; gap: 30px;">
				            <li class="nav-item">
				                <a class="nav-link active text-dark font-weight-bold p-0 pb-2 text-uppercase" style="border: none; border-bottom: 2px solid #000; font-size: 13px; background: none;" id="intro-tab" data-toggle="tab" href="#intro" role="tab" aria-controls="intro" aria-selected="true">Giới thiệu</a>
				            </li>
				            <li class="nav-item">
				                <a class="nav-link text-muted font-weight-bold p-0 pb-2 text-uppercase" style="border: none; font-size: 13px; background: none;" id="detail-tab" data-toggle="tab" href="#detail" role="tab" aria-controls="detail" aria-selected="false">Chi tiết sản phẩm</a>
				            </li>
				            <li class="nav-item">
				                <a class="nav-link text-muted font-weight-bold p-0 pb-2 text-uppercase" style="border: none; font-size: 13px; background: none;" id="preserve-tab" data-toggle="tab" href="#preserve" role="tab" aria-controls="preserve" aria-selected="false">Bảo quản</a>
				            </li>
				        </ul>
				        <div class="tab-content" id="detailTabContent">
				            <div class="tab-pane fade show active" id="intro" role="tabpanel" aria-labelledby="intro-tab">
				                <div id="productDescription" class="product-desc-wrapper collapsed" style="max-height: 150px; overflow: hidden; position: relative;">
				                    <div class="text-muted product-desc-content" style="font-size: 14px; line-height: 1.8;">
				                        <p th:text="${product.description}" style="white-space: pre-line;"></p>
				                    </div>
				                </div>
				                <div class="text-center mt-3 toggle-container">
				                    <div class="toggle-line" style="height: 1px; background: #eee; width: 100%; position: relative;"></div>
				                    <button type="button" class="btn-toggle-desc bg-white" onclick="toggleDescription()" style="position: relative; top: -15px; border: 1px solid #eee; border-radius: 50%; width: 30px; height: 30px;">
				                        <i id="toggleIcon" class="fas fa-chevron-down"></i>
				                    </button>
				                </div>
				            </div>
				            <div class="tab-pane fade" id="detail" role="tabpanel" aria-labelledby="detail-tab">
				                <div class="text-muted" style="font-size: 14px; line-height: 1.8;">
				                    Thông tin chi tiết đang được cập nhật.
				                </div>
				            </div>
				            <div class="tab-pane fade" id="preserve" role="tabpanel" aria-labelledby="preserve-tab">
				                <div class="text-muted" style="font-size: 14px; line-height: 1.8;">
				                    Thông tin bảo quản đang được cập nhật.
				                </div>
				            </div>
				        </div>
				    </div>
                </div>

            </div>
        </div>
    </div>

    <th:block layout:fragment="pageScripts">
        <script>
            // 1. Đổi ảnh chính
            function changeMainImage(thumbElement, newSrc) {
                document.getElementById('mainImage').src = newSrc;
                document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
                thumbElement.classList.add('active');
            }

            // 2. Cuộn Thumbnails bằng nút mũi tên dọc (Máy tính)
 function scrollThumbs(direction) {
    const container = document.getElementById('thumbScroller');
    const scrollAmount = 165; // Cuộn đúng chiều cao 1 ảnh + margin
    
    if (direction === 'up') {
        container.scrollTop -= scrollAmount;
    } else {
        container.scrollTop += scrollAmount;
    }
}

            // 2.5 Nút qua lại trên ảnh chính (Slider)
            function nextMainImage() {
                const thumbs = Array.from(document.querySelectorAll('.thumb-img'));
                if (thumbs.length === 0) return;
                let activeIdx = thumbs.findIndex(t => t.classList.contains('active'));
                let nextIdx = (activeIdx + 1) % thumbs.length;
                thumbs[nextIdx].click();
                thumbs[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            function prevMainImage() {
                const thumbs = Array.from(document.querySelectorAll('.thumb-img'));
                if (thumbs.length === 0) return;
                let activeIdx = thumbs.findIndex(t => t.classList.contains('active'));
                let prevIdx = (activeIdx - 1 + thumbs.length) % thumbs.length;
                thumbs[prevIdx].click();
                thumbs[prevIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            // 3. Chọn Size
            function selectSize(element) {
                // Nếu bị disabled (hết hàng) thì không làm gì
                if (element.classList.contains('disabled')) return;

                document.querySelectorAll('.size-box').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
                
                element.querySelector('input').checked = true;
                document.getElementById('size-error').style.display = 'none';
            }

            function updateQty(change) {
                const input = document.getElementById('qtyInput');
                let newVal = parseInt(input.value) + change;
                if (newVal < 1) newVal = 1;
                input.value = newVal;
            }
            
            function toggleWishlistDetail(btn) {
                const productId = btn.getAttribute('data-product-id');
                $.post('/api/wishlist/toggle/' + productId, function(response) {
                    if (response.status === 'success') {
                        Swal.fire({
                            title: 'Thành công',
                            text: response.message,
                            icon: 'success',
                            showConfirmButton: false,
                            timer: 1500
                        });
                        const icon = btn.querySelector('i');
                        if (response.added) {
                            icon.classList.remove('far');
                            icon.classList.add('fas');
                            icon.style.color = '#dc3545';
                        } else {
                            icon.classList.remove('fas');
                            icon.classList.add('far');
                            icon.style.color = '';
                        }
                    }
                }).fail(function(xhr) {
                    var res = xhr.responseJSON;
                    Swal.fire('Thông báo', res ? res.message : 'Có lỗi xảy ra', 'info');
                });
            }
            
            
            function toggleDescription() {
                const wrapper = document.getElementById('productDescription');
                const icon = document.getElementById('toggleIcon');
                
                if (wrapper.classList.contains('collapsed')) {
                    // MỞ RỘNG
                    wrapper.classList.remove('collapsed');
                    // Cho phép chiều cao mở rộng tự động theo nội dung
                    wrapper.style.maxHeight = wrapper.scrollHeight + "px";
                    
                    // Đổi icon thành mũi tên lên
                    icon.classList.remove('fa-chevron-down');
                    icon.classList.add('fa-chevron-up');
                } else {
                    // THU GỌN
                    wrapper.classList.add('collapsed');
                    wrapper.style.maxHeight = "150px"; // Trở về chiều cao giới hạn ban đầu
                    
                    // Đổi icon thành mũi tên xuống
                    icon.classList.remove('fa-chevron-up');
                    icon.classList.add('fa-chevron-down');
                    
                    // Cuộn nhẹ lên đầu phần chi tiết để người dùng không bị lạc
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
            
            
        </script>
    </th:block>
</body>
</html>
