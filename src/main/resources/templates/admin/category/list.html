<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout}">

<head>
<title>Quản lý danh mục</title>
</head>

<body>

	<div layout:fragment="content">

		<h1 class="h3 mb-4 text-gray-800">Danh sách Danh mục sản phẩm</h1>

		<div class="card shadow mb-4">
			<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
				<form th:action="@{/admin/categories}" method="get" class="form-inline mb-0">
					<div class="input-group input-group-sm search-group mr-2">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-search"></i></span>
						</div>
						<input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm danh mục...">
					</div>
					<button type="submit" class="d-none"></button>
					<a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
				</form>
				<a th:href="@{/admin/categories/new}" class="btn btn-sm btn-primary shadow-sm">
					<i class="fas fa-plus fa-sm text-white-50"></i> Thêm mới
				</a>
			</div>
			<div class="card-body">

				<div class="table-responsive">
					<table class="table table-bordered" width="100%" cellspacing="0">
						<thead>
							<tr>
								<th class="d-none d-md-table-cell">ID</th>
								<th>Tên danh mục</th>
								<th class="d-none d-md-table-cell">Đường dẫn (Slug)</th>
								<th class="d-none d-md-table-cell">Danh mục cha</th>
								<th class="d-none d-md-table-cell">Trạng thái</th>
								<th class="text-center" style="width: 120px;">Hành động</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="cat : ${categories}">
								<td class="d-none d-md-table-cell" th:text="${cat.id}">1</td>
								<td th:text="${cat.name}" class="font-weight-bold text-primary">Áo
									nam</td>
								<td class="d-none d-md-table-cell" th:text="${cat.slug}">ao-nam</td>

								<td class="d-none d-md-table-cell"><span th:if="${cat.parent == null}"
									class="text-muted font-italic">Không có</span> <span
									th:unless="${cat.parent == null}" th:text="${cat.parent.name}">Quần
										áo</span></td>

								<td class="d-none d-md-table-cell"><span th:if="${cat.isActive}"
									class="badge badge-success">Hiển thị</span> <span
									th:unless="${cat.isActive}" class="badge badge-secondary">Ẩn</span>
								</td>

								<td class="text-center">
									<a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
									class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa">
										<i class="fas fa-edit" style="font-size: 16px;"></i>
									</a>
									<a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
									class="btn btn-link action-icon hover-danger p-1 mx-1"
									onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');" title="Xóa">
										<i class="fas fa-trash-alt" style="font-size: 16px;"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<!-- Phân trang -->
				<div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/categories')}"></div>
			</div>
		</div>

	</div>

</body>
</html>
