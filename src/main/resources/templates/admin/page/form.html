<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Thêm/Sửa Trang Tĩnh</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800" th:text="${page.id == null ? 'Thêm Trang Mới' : 'Sửa Trang'}"></h1>
            <a th:href="@{/admin/pages}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50"></i> Quay lại
            </a>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <form th:action="@{${page.id == null ? '/admin/pages/create' : '/admin/pages/edit/' + page.id}}" th:object="${page}" method="post">
                    
                    <div class="form-group">
                        <label for="title">Tiêu đề</label>
                        <input type="text" class="form-control" id="title" th:field="*{title}" required onkeyup="generateSlug()">
                    </div>

                    <div class="form-group">
                        <label for="slug">Đường dẫn (Slug)</label>
                        <input type="text" class="form-control" id="slug" th:field="*{slug}" required>
                    </div>

                    <div class="form-group">
                        <label for="editor">Nội dung</label>
                        <textarea class="form-control" id="editor" th:field="*{content}"></textarea>
                    </div>

                    <div class="form-group">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="isActive" th:field="*{isActive}">
                            <label class="custom-control-label" for="isActive">Hiển thị trang này</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Lưu trang</button>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="pageScripts">
        <!-- CKEditor 5 CDN -->
        <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
        <script>
            ClassicEditor
                .create(document.querySelector('#editor'))
                .catch(error => {
                    console.error(error);
                });

            function generateSlug() {
                var title = document.getElementById('title').value;
                var slug = title.toLowerCase()
                    .replace(/á|à|ả|ạ|ã|ă|ắ|ằ|ẳ|ẵ|ặ|â|ấ|ầ|ẩ|ẫ|ậ/gi, 'a')
                    .replace(/é|è|ẻ|ẽ|ẹ|ê|ế|ề|ể|ễ|ệ/gi, 'e')
                    .replace(/i|í|ì|ỉ|ĩ|ị/gi, 'i')
                    .replace(/ó|ò|ỏ|õ|ọ|ô|ố|ồ|ổ|ỗ|ộ|ơ|ớ|ờ|ở|ỡ|ợ/gi, 'o')
                    .replace(/ú|ù|ủ|ũ|ụ|ư|ứ|ừ|ử|ữ|ự/gi, 'u')
                    .replace(/ý|ỳ|ỷ|ỹ|ỵ/gi, 'y')
                    .replace(/đ/gi, 'd')
                    .replace(/\`|\~|\!|\@|\#|\||\$|\%|\^|\&|\*|\(|\)|\+|\=|\,|\.|\/|\?|\>|\<|\'|\"|\:|\;|_/gi, '')
                    .replace(/ /gi, "-")
                    .replace(/\-\-\-\-\-/gi, '-')
                    .replace(/\-\-\-\-/gi, '-')
                    .replace(/\-\-\-/gi, '-')
                    .replace(/\-\-/gi, '-')
                    .replace(/^\-+|\-+$/g, '');
                document.getElementById('slug').value = slug;
            }
        </script>
    </th:block>
</body>
</html>
