<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý Trang Tĩnh</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="h3 mb-4 text-gray-800">Quản lý Trang Tĩnh</h1>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <form th:action="@{/admin/pages}" method="get" class="form-inline mb-0">
                    <div class="input-group input-group-sm search-group mr-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                        </div>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm trang tĩnh...">
                    </div>
                    <button type="submit" class="d-none"></button>
                    <a th:href="@{/admin/pages}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
                </form>
                <a th:href="@{/admin/pages/create}" class="btn btn-sm btn-primary shadow-sm">
                    <i class="fas fa-plus fa-sm text-white-50"></i> Thêm trang mới
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tiêu đề</th>
                                <th>Đường dẫn (Slug)</th>
                                <th>Trạng thái</th>
                                <th class="text-center" style="width: 140px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="page : ${pages}">
                                <td th:text="${page.id}"></td>
                                <td th:text="${page.title}"></td>
                                <td th:text="${page.slug}"></td>
                                <td>
                                    <span th:if="${page.isActive}" class="badge badge-success">Hiển thị</span>
                                    <span th:unless="${page.isActive}" class="badge badge-secondary">Ẩn</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/pages/edit/{id}(id=${page.id})}" class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa">
                                        <i class="fas fa-edit" style="font-size: 16px;"></i>
                                    </a>
                                    <a th:href="@{/admin/pages/delete/{id}(id=${page.id})}" class="btn btn-link action-icon hover-danger p-1 mx-1" onclick="return confirm('Bạn có chắc chắn muốn xóa trang này?');" title="Xóa">
                                        <i class="fas fa-trash-alt" style="font-size: 16px;"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pages)}">
                                <td colspan="5" class="text-center">Chưa có trang nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
