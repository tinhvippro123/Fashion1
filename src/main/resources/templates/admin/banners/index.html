<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout}">
<head>
<title>Quản lý Banner</title>
</head>
<body>
	<div layout:fragment="content">
		<h1 class="h3 mb-4 text-gray-800">Danh sách Banner</h1>

		<div class="card shadow mb-4">
			<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
				<form th:action="@{/admin/banners}" method="get" class="form-inline mb-0">
					<div class="input-group input-group-sm search-group mr-2">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-search"></i></span>
						</div>
						<input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm đường dẫn (URL)...">
					</div>
					<button type="submit" class="d-none"></button>
					<a th:href="@{/admin/banners}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
				</form>
				<a th:href="@{/admin/banners/add}" class="btn btn-sm btn-primary shadow-sm">
					<i class="fas fa-plus fa-sm text-white-50"></i> Thêm banner mới
				</a>
			</div>
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-bordered" width="100%" cellspacing="0">
						<thead>
							<tr>
								<th class="d-none d-lg-table-cell">ID</th>
								<th width="300">Hình ảnh</th>
								<th class="d-none d-lg-table-cell">Đường link (Target URL)</th>
								<th class="d-none d-lg-table-cell">Thứ tự</th>
								<th class="d-none d-lg-table-cell">Vị trí</th>
								<th class="d-none d-lg-table-cell">Trạng thái</th>
								<th class="text-center" style="width: 120px;">Hành động</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="b : ${banners}">
								<td class="d-none d-lg-table-cell" th:text="${b.id}"></td>
								<td>
									<img th:if="${b.imageName != null}" 
										 th:src="${b.imageName != null and #strings.startsWith(b.imageName, 'http') ? b.imageName : '/uploads/' + b.imageName}" 
										 class="img-thumbnail" style="width: 280px; height: 100px; object-fit: cover;">
								</td>
								<td class="d-none d-lg-table-cell">
									<a th:href="${b.targetUrl}" target="_blank" th:text="${b.targetUrl}"></a>
								</td>
								<td class="d-none d-lg-table-cell" th:text="${b.displayOrder}"></td>
								<td class="d-none d-lg-table-cell">
									<span th:if="${b.position == 'HOME_MAIN'}" class="badge badge-primary">Trang chủ</span>
									<span th:if="${b.position == 'CONTACT'}" class="badge badge-info">Liên hệ</span>
								</td>
								<td class="d-none d-lg-table-cell">
									<span th:if="${b.isActive}" class="badge badge-success">Hiển thị</span>
									<span th:unless="${b.isActive}" class="badge badge-secondary">Đã ẩn</span>
								</td>
								<td class="text-center">
									<a th:href="@{/admin/banners/edit/{id}(id=${b.id})}" class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa">
										<i class="fas fa-edit" style="font-size: 16px;"></i>
									</a>
									<a th:href="@{/admin/banners/delete/{id}(id=${b.id})}" class="btn btn-link action-icon hover-danger p-1 mx-1"
									   onclick="return confirm('Bạn có chắc muốn xóa banner này?');" title="Xóa">
										<i class="fas fa-trash-alt" style="font-size: 16px;"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<!-- Phân trang -->
				<div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/banners')}"></div>
			</div>
		</div>
	</div>
</body>
</html>
