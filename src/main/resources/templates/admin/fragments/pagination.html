<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="pagination(page, baseUrl)" class="mt-3">
		<nav aria-label="Page navigation" th:if="${page.totalPages > 1}">
			<ul class="pagination justify-content-center">
				
				<!-- Nút Previous -->
				<li class="page-item" th:classappend="${page.first} ? 'disabled'">
					<a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1}, keyword=${param.keyword})}" tabindex="-1">Trước</a>
				</li>
				
				<!-- Danh sách các trang -->
				<li class="page-item" 
					th:each="pageNum : ${#numbers.sequence(0, page.totalPages - 1)}"
					th:classappend="${pageNum == page.number} ? 'active'">
					<a class="page-link" th:href="@{${baseUrl}(page=${pageNum}, keyword=${param.keyword})}" th:text="${pageNum + 1}"></a>
				</li>
				
				<!-- Nút Next -->
				<li class="page-item" th:classappend="${page.last} ? 'disabled'">
					<a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1}, keyword=${param.keyword})}">Sau</a>
				</li>
			</ul>
		</nav>
	</div>
</body>
</html>
