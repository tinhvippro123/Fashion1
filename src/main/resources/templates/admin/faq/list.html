<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý Hỏi đáp (FAQ) | Admin</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-4 text-gray-800">Quản lý Hỏi đáp (FAQ)</h1>

    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <form th:action="@{/admin/faqs}" method="get" class="form-inline mb-0">
                <div class="input-group input-group-sm search-group mr-2">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                    </div>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm câu hỏi...">
                </div>
                <button type="submit" class="d-none"></button>
                <a th:href="@{/admin/faqs}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
            </form>
            <a th:href="@{/admin/faqs/add}" class="btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Thêm mới
            </a>
        </div>
        <div class="card-body">
            <div th:if="${successMessage}" class="alert alert-success m-3" th:text="${successMessage}"></div>
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th class="d-none d-lg-table-cell text-center" style="width: 5%;">ID</th>
                        <th style="width: 35%;">Câu hỏi</th>
                        <th class="d-none d-lg-table-cell" style="width: 30%;">Trả lời</th>
                        <th class="text-center" style="width: 10%;">Vị trí</th>
                        <th class="text-center" style="width: 10%;">Trạng thái</th>
                        <th class="text-center" style="width: 140px;">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="faq : ${faqs}">
                        <td class="d-none d-lg-table-cell text-center" th:text="${faq.id}">1</td>
                        <td th:text="${faq.question}">Câu hỏi?</td>
                        <td class="d-none d-lg-table-cell">
                            <span class="d-inline-block text-truncate" style="max-width: 250px;" th:text="${faq.answer}">Trả lời...</span>
                        </td>
                        <td class="text-center" th:text="${faq.displayOrder}">0</td>
                        <td class="text-center">
                            <span th:if="${faq.status}" class="badge badge-success">Active</span>
                            <span th:unless="${faq.status}" class="badge badge-secondary">Hidden</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/faqs/edit/{id}(id=${faq.id})}" class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa"><i class="fas fa-edit" style="font-size: 16px;"></i></a>
                            <a th:href="@{/admin/faqs/delete/{id}(id=${faq.id})}" class="btn btn-link action-icon hover-danger p-1 mx-1" title="Xóa"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa câu hỏi này?');"><i class="fas fa-trash-alt" style="font-size: 16px;"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(faqs)}">
                        <td colspan="6" class="text-center text-muted py-4">Chưa có câu hỏi nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
