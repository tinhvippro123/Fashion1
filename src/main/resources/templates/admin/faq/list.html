<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý FAQ | Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-primary font-weight-bold"><i class="fas fa-question-circle mr-2"></i>Quản lý Câu hỏi thường gặp</h5>
                        <a th:href="@{/admin/faqs/add}" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                            <i class="fas fa-plus mr-1"></i> Thêm mới
                        </a>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${successMessage}" class="alert alert-success m-3" th:text="${successMessage}"></div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                <tr>
                                    <th class="border-top-0 border-bottom-0 text-center" style="width: 5%">ID</th>
                                    <th class="border-top-0 border-bottom-0" style="width: 35%">Câu hỏi</th>
                                    <th class="border-top-0 border-bottom-0" style="width: 30%">Trả lời</th>
                                    <th class="border-top-0 border-bottom-0 text-center" style="width: 10%">Vị trí</th>
                                    <th class="border-top-0 border-bottom-0 text-center" style="width: 10%">Trạng thái</th>
                                    <th class="border-top-0 border-bottom-0 text-center" style="width: 10%">Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="faq : ${faqs}">
                                    <td class="text-center" th:text="${faq.id}">1</td>
                                    <td th:text="${faq.question}">Câu hỏi?</td>
                                    <td>
                                        <span class="d-inline-block text-truncate" style="max-width: 250px;" th:text="${faq.answer}">Trả lời...</span>
                                    </td>
                                    <td class="text-center" th:text="${faq.displayOrder}">0</td>
                                    <td class="text-center">
                                        <span class="badge badge-success px-2 py-1" th:if="${faq.status}">Hiện</span>
                                        <span class="badge badge-secondary px-2 py-1" th:unless="${faq.status}">Ẩn</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/admin/faqs/edit/{id}(id=${faq.id})}" class="btn btn-outline-info btn-sm rounded-circle mx-1" title="Sửa">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/admin/faqs/delete/{id}(id=${faq.id})}" class="btn btn-outline-danger btn-sm rounded-circle mx-1" title="Xóa"
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa câu hỏi này?');">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(faqs)}">
                                    <td colspan="6" class="text-center text-muted py-4">Chưa có câu hỏi nào.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
