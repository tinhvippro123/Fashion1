<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}"> <head>
    <title>Danh sách người dùng</title>
</head>

<body>

    <div layout:fragment="content">

        <h1 class="h3 mb-2 text-gray-800">Quản lý người dùng</h1>
        <p class="mb-4">Danh sách tất cả người dùng trong hệ thống.</p>

        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <form th:action="@{/admin/users}" method="get" class="form-inline mb-0">
                    <div class="input-group input-group-sm search-group mr-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                        </div>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm tên, email...">
                    </div>
                    <button type="submit" class="d-none"></button>
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
                </form>
                <a th:href="@{/admin/users/new}" class="btn btn-sm btn-primary shadow-sm">
                    <i class="fas fa-plus fa-sm text-white-50"></i> Thêm mới
                </a>
            </div>
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th class="d-none d-md-table-cell">ID</th>
                                <th>Họ tên</th>
                                <th class="d-none d-md-table-cell">Email</th>
                                <th class="d-none d-md-table-cell">Vai trò</th>
                                <th class="d-none d-md-table-cell">Trạng thái</th>
                                <th class="text-center" style="width: 140px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="d-none d-md-table-cell" th:text="${user.id}">1</td>
                                <td th:text="${user.fullName}">Nguyễn Văn A</td>
                                <td class="d-none d-md-table-cell" th:text="${user.email}">a@gmail.com</td>
                                <td class="d-none d-md-table-cell" th:text="${user.role}">USER</td>
                                <td class="d-none d-md-table-cell">
                                    <span th:if="${user.isActive}" class="badge badge-success">Active</span>
                                    <span th:unless="${user.isActive}" class="badge badge-danger">Locked</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa"><i class="fas fa-edit" style="font-size: 16px;"></i></a>
                                    <a th:href="@{/admin/users/{userId}/addresses(userId=${user.id})}" class="btn btn-link action-icon hover-success p-1 mx-1" title="Địa chỉ"><i class="fas fa-map-marker-alt" style="font-size: 16px;"></i></a>
                                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-link action-icon hover-danger p-1 mx-1" onclick="return confirm('Bạn chắc chắn muốn xóa?');" title="Xóa"><i class="fas fa-trash-alt" style="font-size: 16px;"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Phân trang -->
                <div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/users')}"></div>
            </div>
        </div>

    </div>

</body>
</html>
