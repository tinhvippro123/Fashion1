<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head><title>Quản lý kích cỡ</title></head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-4 text-gray-800">Danh sách Kích cỡ (Size)</h1>
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <form th:action="@{/admin/sizes}" method="get" class="form-inline mb-0">
                <div class="input-group input-group-sm search-group mr-2">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                    </div>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm tên size...">
                </div>
                <button type="submit" class="d-none"></button>
                <a th:href="@{/admin/sizes}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
            </form>
            <a th:href="@{/admin/sizes/new}" class="btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Thêm kích cỡ mới
            </a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Size</th>
                            <th>Thứ tự sắp xếp</th>
                            <th class="text-center" style="width: 120px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${sizes}">
                            <td th:text="${item.id}"></td>
                            <td th:text="${item.name}"></td>
                            <td th:text="${item.sortOrder}"></td>
                            <td class="text-center">
                                <a th:href="@{/admin/sizes/edit/{id}(id=${item.id})}" class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa"><i class="fas fa-edit" style="font-size: 16px;"></i></a>
                                <a th:href="@{/admin/sizes/delete/{id}(id=${item.id})}" class="btn btn-link action-icon hover-danger p-1 mx-1" onclick="return confirm('Xóa size này?');" title="Xóa"><i class="fas fa-trash-alt" style="font-size: 16px;"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Phân trang -->
            <div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/sizes')}"></div>
        </div>
    </div>
</div>
</body>
</html>
