<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head><title>Quản lý màu sắc</title></head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-4 text-gray-800">Danh sách Màu sắc</h1>
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <h6 class="m-0 font-weight-bold text-primary">Danh sách Màu sắc</h6>
            <a th:href="@{/admin/colors/new}" class="btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Thêm màu mới
            </a>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/colors}" method="get" class="form-inline mb-3">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control mr-sm-2 mb-2 mb-sm-0" placeholder="Tìm kiếm tên màu...">
                <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Tìm kiếm</button>
                <a th:href="@{/admin/colors}" class="btn btn-secondary ml-2" th:if="${keyword != null}">Làm mới</a>
            </form>
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên màu</th>
                            <th>Mã Hex</th>
                            <th>Hiển thị</th> <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${colors}">
                            <td th:text="${item.id}"></td>
                            <td th:text="${item.name}"></td>
                            <td th:text="${item.hexCode}"></td>
                            <td class="text-center">
                                <span th:style="'background-color:' + ${item.hexCode} + '; display:inline-block; width:30px; height:30px; border:1px solid #ccc;'"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/colors/edit/{id}(id=${item.id})}" class="btn btn-info btn-sm">Sửa</a>
                                <a th:href="@{/admin/colors/delete/{id}(id=${item.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Xóa màu này?');">Xóa</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Phân trang -->
            <div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/colors')}"></div>
        </div>
    </div>
</div>
</body>
</html>
