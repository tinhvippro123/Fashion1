<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý Đơn hàng</title>
</head>
<body>
    <div layout:fragment="content">
        
        <h1 class="h3 mb-2 text-gray-800">Quản lý Đơn hàng</h1>
        <p class="mb-4">Danh sách tất cả các đơn hàng trong hệ thống.</p>

        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <form th:action="@{/admin/orders}" method="get" class="form-inline mb-0">
                    <div class="input-group input-group-sm search-group mr-2 flex-nowrap">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                        </div>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="width: 300px;" placeholder="Tìm kiếm mã, tên, email, sđt...">
                    </div>
                    <button type="submit" class="d-none"></button>
                    <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
                </form>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th class="d-none d-lg-table-cell">Ngày đặt</th>
                                <th class="d-none d-lg-table-cell">Tổng tiền</th>
                                <th class="d-none d-lg-table-cell">TT Thanh toán</th>
                                <th>Trạng thái</th>
                                <th class="text-center" style="width: 120px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                
                                <td>
                                    <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" 
                                       class="font-weight-bold text-primary" 
                                       th:text="'#' + ${order.id}">#1001</a>
                                </td>

                                <td th:text="${order.receiverName}">Nguyễn Văn A</td>

                                <td class="d-none d-lg-table-cell" th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">12-12-2024 10:30</td>

                                <td class="d-none d-lg-table-cell" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                    1.500.000đ
                                </td>

                                <td class="d-none d-lg-table-cell">
                                    <span th:if="${order.payment.paymentStatus.name() == 'PAID'}" class="badge badge-success">Đã thanh toán</span>
                                    <span th:if="${order.payment.paymentStatus.name() == 'UNPAID'}" class="badge badge-secondary">Chưa thanh toán</span>
                                    <span th:if="${order.payment.paymentStatus.name() == 'REFUNDED'}" class="badge badge-warning">Đã hoàn tiền</span>
                                </td>

                                <td>
                                    <span th:classappend="${
                                        order.status.name() == 'PENDING' ? 'badge badge-warning' : 
                                        (order.status.name() == 'CONFIRMED' ? 'badge badge-info' :
                                        (order.status.name() == 'SHIPPING' ? 'badge badge-primary' :
                                        (order.status.name() == 'COMPLETED' ? 'badge badge-success' :
                                        'badge badge-danger')))
                                    }" 
                                    th:text="${order.status}">PENDING</span>
                                </td>

                                <td class="text-center">
                                    <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" class="btn btn-link action-icon hover-info p-1 mx-1" title="Chi tiết">
                                        <i class="fas fa-eye" style="font-size: 16px;"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Phân trang -->
                <div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/orders')}"></div>
            </div>
        </div>

    </div>
</body>
</html>
