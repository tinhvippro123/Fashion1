<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout}">
<head>
<title>Quản lý sản phẩm</title>
</head>
<body>
	<div layout:fragment="content">
		<h1 class="h3 mb-4 text-gray-800">Danh sách Sản phẩm</h1>

		<div class="card shadow mb-4">
			<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
				<form th:action="@{/admin/products}" method="get" class="form-inline mb-0">
					<div class="input-group input-group-sm search-group mr-2">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-search"></i></span>
						</div>
						<input type="text" name="keyword" th:value="${keyword}" class="form-control" style="min-width: 260px;" placeholder="Tìm kiếm tên sản phẩm...">
					</div>
					<button type="submit" class="d-none"></button>
					<a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm" th:if="${keyword != null}" title="Làm mới"><i class="fas fa-sync-alt"></i></a>
				</form>
				<a th:href="@{/admin/products/new}" class="btn btn-sm btn-primary shadow-sm">
					<i class="fas fa-plus fa-sm text-white-50"></i> Thêm mới
				</a>
			</div>
			<div class="card-body">

				<div class="table-responsive">
					<table class="table table-bordered" width="100%" cellspacing="0">
						<thead>
							<tr>
								<th class="d-none d-md-table-cell">ID</th>
								<th width="100">Hình ảnh</th>
								<th>Tên sản phẩm</th>
								<th class="d-none d-lg-table-cell">Danh mục</th>
								<th class="d-none d-md-table-cell">Giá gốc</th>
								<th class="d-none d-md-table-cell">Trạng thái</th>
								<th class="text-center" style="width: 140px;">Hành động</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="p : ${products}">
								<td class="d-none d-md-table-cell" th:text="${p.id}"></td>

								<td><img
									th:if="${not #lists.isEmpty(p.productColors) 
                          and not #lists.isEmpty(p.productColors[0].images)}"
									th:src="${p.productColors[0].images[0].imageUrl != null and #strings.startsWith(p.productColors[0].images[0].imageUrl, 'http') ? p.productColors[0].images[0].imageUrl : '/uploads/' + p.productColors[0].images[0].imageUrl}"
									class="img-thumbnail"
									style="width: 80px; height: 100px; object-fit: cover;">

									<div
										th:unless="${not #lists.isEmpty(p.productColors) 
                            and not #lists.isEmpty(p.productColors[0].images)}"
										class="text-center text-muted border d-flex align-items-center justify-content-center"
										style="width: 80px; height: 100px; background: #f8f9fa;">
										<i class="fas fa-image fa-2x"></i>
									</div></td>


								<td><span th:text="${p.name}"
									class="font-weight-bold text-primary"></span>
									<small class="d-none d-md-block text-muted mt-1" th:text="${p.slug}"></small></td>

								<td class="d-none d-lg-table-cell"
									th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}"></td>

								<td class="d-none d-md-table-cell"
									th:text="${#numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

								<td class="d-none d-md-table-cell"><span th:if="${p.isActive}" class="badge badge-success">Đang
										bán</span> <span th:unless="${p.isActive}"
									class="badge badge-secondary">Ngừng bán</span></td>

								<td class="text-center">
									<a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
									class="btn btn-link action-icon hover-info p-1 mx-1" title="Sửa thông tin">
										<i class="fas fa-edit" style="font-size: 16px;"></i>
									</a>
									<a th:href="@{/admin/products/variants/{id}(id=${p.id})}"
									class="btn btn-link action-icon hover-warning p-1 mx-1" title="Quản lý Màu & Size">
										<i class="fas fa-layer-group" style="font-size: 16px;"></i>
									</a>
									<a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
									class="btn btn-link action-icon hover-danger p-1 mx-1"
									onclick="return confirm('Xóa sản phẩm này?');" title="Xóa">
										<i class="fas fa-trash-alt" style="font-size: 16px;"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<!-- Phân trang -->
				<div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/products')}"></div>
			</div>
		</div>
	</div>
</body>
</html>
