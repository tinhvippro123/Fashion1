<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout}">
<head>
<title>Quản lý sản phẩm</title>
</head>
<body>
	<div layout:fragment="content">
		<h1 class="h3 mb-4 text-gray-800">Danh sách Sản phẩm</h1>

		<div class="card shadow mb-4">
			<div class="card-header py-3">
				<a th:href="@{/admin/products/new}" class="btn btn-primary btn-sm">
					<i class="fas fa-plus"></i> Thêm sản phẩm mới
				</a>
			</div>
			<div class="card-body">
				<form th:action="@{/admin/products}" method="get" class="form-inline mb-3">
					<input type="text" name="keyword" th:value="${keyword}" class="form-control mr-sm-2 mb-2 mb-sm-0" placeholder="Tìm kiếm tên sản phẩm...">
					<button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Tìm kiếm</button>
					<a th:href="@{/admin/products}" class="btn btn-secondary ml-2" th:if="${keyword != null}">Làm mới</a>
				</form>

				<div class="table-responsive">
					<table class="table table-bordered" width="100%" cellspacing="0">
						<thead>
							<tr>
								<th class="d-none d-md-table-cell">ID</th>
								<th width="100">Hình ảnh</th>
								<th>Tên sản phẩm</th>
								<th class="d-none d-md-table-cell">Danh mục</th>
								<th class="d-none d-md-table-cell">Giá gốc</th>
								<th class="d-none d-md-table-cell">Trạng thái</th>
								<th>Hành động</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="p : ${products}">
								<td class="d-none d-md-table-cell" th:text="${p.id}"></td>

								<td><img
									th:if="${not #lists.isEmpty(p.productColors) 
                          and not #lists.isEmpty(p.productColors[0].images)}"
									th:src="@{'' + ${p.productColors[0].images[0].imageUrl}}"
									class="img-thumbnail"
									style="width: 80px; height: 100px; object-fit: cover;">

									<div
										th:unless="${not #lists.isEmpty(p.productColors) 
                            and not #lists.isEmpty(p.productColors[0].images)}"
										class="text-center text-muted border d-flex align-items-center justify-content-center"
										style="width: 80px; height: 100px; background: #f8f9fa;">
										<i class="fas fa-image fa-2x"></i>
									</div></td>


								<td><span th:text="${p.name}"
									class="font-weight-bold text-primary"></span> <br> <small
									th:text="${p.slug}"></small></td>

								<td class="d-none d-md-table-cell"
									th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}"></td>

								<td class="d-none d-md-table-cell"
									th:text="${#numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

								<td class="d-none d-md-table-cell"><span th:if="${p.isActive}" class="badge badge-success">Đang
										bán</span> <span th:unless="${p.isActive}"
									class="badge badge-secondary">Ngừng bán</span></td>

								<td><a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
									class="btn btn-info btn-sm mb-1 mr-1" title="Sửa thông tin"> <i
										class="fas fa-edit"></i>
								</a> <a th:href="@{/admin/products/variants/{id}(id=${p.id})}"
									class="btn btn-warning btn-sm mb-1 mr-1" title="Quản lý Màu & Size">
										<i class="fas fa-layer-group"></i> Biến thể
								</a> <a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
									class="btn btn-danger btn-sm mb-1 mr-1"
									onclick="return confirm('Xóa sản phẩm này?');" title="Xóa">
										<i class="fas fa-trash"></i>
								</a></td>
							</tr>
						</tbody>
					</table>
				</div>
				<!-- Phân trang -->
				<div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/products')}"></div>
			</div>
		</div>
	</div>
</body>
</html>
