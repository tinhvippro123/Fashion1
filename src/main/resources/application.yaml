spring:
  application:
    name: fashionshop

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/FashionDB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update   # Hoặc validate nếu DB đã có sẵn
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cloudinary Configuration
cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://432231466341726:xBGOokPoQSU9TBt1ry7OMqWaz_s@dan2b8knu}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForFashionShopApp2026WithAtLeast32Bytes}
  expiration: ${JWT_EXPIRATION:604800000}

spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME:your-email@gmail.com}
  password: ${MAIL_PASSWORD:your-app-password}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

